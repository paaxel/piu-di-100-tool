<div class="section-block">
  <app-section-card title="Lettore Barcode" subtitle="Carica un'immagine e leggi codici 1D (EAN, UPC, CODE128, ecc.)">
    <app-file-dropzone label="Seleziona immagine" accept="image/*" (fileChange)="onFile($event)"></app-file-dropzone>
    <div class="mt-3" *ngIf="preview">
      <button class="btn btn-primary me-2" (click)="decode()" [disabled]="loading">Decodifica</button>
      <button class="btn btn-outline-secondary" (click)="reset()" [disabled]="loading">Reset</button>
      <span *ngIf="loading" class="ms-2 spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    </div>

    <div *ngIf="!nativeSupported" class="alert alert-info mt-3 mb-0">
      BarcodeDetector non disponibile: uso fallback ZXing (potrebbe essere piu lento).
    </div>

    <div *ngIf="usingFallback && nativeSupported" class="alert alert-info mt-3 mb-0">
      BarcodeDetector non ha rilevato codici: uso fallback ZXing.
    </div>

    <div class="row g-3 mt-2" *ngIf="preview">
      <div class="col-12 col-lg-5">
        <img [src]="preview" class="img-fluid rounded border" alt="Input barcode">
      </div>
      <div class="col-12 col-lg-7">
        <div *ngIf="loading" class="alert alert-info">Decodifica in corso...</div>
        <div *ngIf="!loading && results.length > 0" class="list-group">
          <div class="list-group-item" *ngFor="let code of results">
            <div><strong>Formato:</strong> {{ code.format }}</div>
            <div><strong>Valore:</strong> <code>{{ code.rawValue }}</code></div>
          </div>
        </div>
        <div *ngIf="!loading && error" class="alert alert-danger mb-0">{{ error }}</div>
      </div>
    </div>
  </app-section-card>
</div>
