<div class="section-block">
	<app-section-card [title]="'TOOLS.PWGEN.TITLE' | translate" [subtitle]="'TOOLS.PWGEN.SUBTITLE' | translate">
		<p class="text-muted">{{ 'TOOLS.PWGEN.CRYPTO_NOTE' | translate }}</p>

		<div class="password-display mb-3">
			<code class="font-mono">{{ password || '—' }}</code>
			<div class="d-flex gap-2 mt-2">
				<button class="btn btn-primary" type="button" (click)="generate()">{{ 'TOOLS.PWGEN.REGENERATE' | translate }}</button>
				<button class="btn btn-outline-secondary" type="button" (click)="copy()" [disabled]="!password">Copy</button>
				<span class="strength-pill ms-auto" [ngClass]="strengthClass">{{ ('TOOLS.PWGEN.STRENGTH_' + strength) | translate }}</span>
			</div>
		</div>

		<form [formGroup]="form" class="row g-3">
			<div class="col-12 col-md-4">
				<label class="form-label">{{ 'TOOLS.PWGEN.LENGTH' | translate }}</label>
				<div class="length-controls">
					<input
						type="range"
						class="form-range"
						[value]="form.get('length')?.value"
						min="4"
						max="128"
						(input)="onLengthSliderInput($event)"
					/>
					<input type="number" class="form-control" formControlName="length" min="4" max="128" (input)="generate()" />
				</div>
			</div>
			<div class="col-12 col-md-8">
				<label class="form-label d-block">{{ 'TOOLS.PWGEN.CHARSET' | translate }}</label>
				<div class="d-flex flex-wrap gap-3">
					<label class="form-check"><input class="form-check-input" type="checkbox" formControlName="lowercase" (change)="onCharsetChange()" /><span class="form-check-label ms-1">a–z</span></label>
					<label class="form-check"><input class="form-check-input" type="checkbox" formControlName="uppercase" (change)="onCharsetChange()" /><span class="form-check-label ms-1">A–Z</span></label>
					<label class="form-check"><input class="form-check-input" type="checkbox" formControlName="digits" (change)="onCharsetChange()" /><span class="form-check-label ms-1">0–9</span></label>
					<label class="form-check"><input class="form-check-input" type="checkbox" formControlName="symbols" (change)="onCharsetChange()" /><span class="form-check-label ms-1">!&#64;#$%</span></label>
					<label class="form-check"><input class="form-check-input" type="checkbox" formControlName="excludeAmbiguous" (change)="generate()" /><span class="form-check-label ms-1">{{ 'TOOLS.PWGEN.EXCLUDE_AMBIGUOUS' | translate }}</span></label>
				</div>
			</div>

			<div class="col-12">
				<div class="require-boxes">
					<label class="require-box" *ngIf="form.get('lowercase')?.value">
						<input class="require-check" type="checkbox" formControlName="requireLowercase" (change)="generate()" />
						<span>Genera almeno 1 minuscola</span>
					</label>
					<label class="require-box" *ngIf="form.get('uppercase')?.value">
						<input class="require-check" type="checkbox" formControlName="requireUppercase" (change)="generate()" />
						<span>Genera almeno 1 maiuscola</span>
					</label>
					<label class="require-box" *ngIf="form.get('digits')?.value">
						<input class="require-check" type="checkbox" formControlName="requireDigits" (change)="generate()" />
						<span>Genera almeno 1 numero</span>
					</label>
					<label class="require-box" *ngIf="form.get('symbols')?.value">
						<input class="require-check" type="checkbox" formControlName="requireSymbols" (change)="generate()" />
						<span>Genera almeno 1 carattere speciale</span>
					</label>
				</div>
			</div>
		</form>
	</app-section-card>
</div>
