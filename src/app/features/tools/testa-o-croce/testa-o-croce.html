<div class="section-block">
	<div class="row g-4 justify-content-center">
		<div class="col-12 col-sm-10 col-md-7 col-xl-5">
			<app-section-card
				[title]="'TOOLS.COIN.TITLE' | translate"
				[subtitle]="'TOOLS.COIN.SUBTITLE' | translate">

				<div class="coin-area">
					<div class="coin"
						[class.coin--flipping]="isFlipping"
						[class.coin--heads]="result === 'heads' && !isFlipping"
						[class.coin--tails]="result === 'tails' && !isFlipping">
						<span *ngIf="isFlipping || !result">🪙</span>
						<span *ngIf="result === 'heads' && !isFlipping">👤</span>
						<span *ngIf="result === 'tails' && !isFlipping">✚</span>
					</div>

					<div class="coin-result mt-3" *ngIf="result && !isFlipping">
						<span class="badge fs-5 px-4 py-2"
							[class.bg-warning]="result === 'heads'"
							[class.text-dark]="result === 'heads'"
							[class.bg-secondary]="result === 'tails'">
							{{ (result === 'heads' ? 'TOOLS.COIN.HEADS' : 'TOOLS.COIN.TAILS') | translate }}
						</span>
					</div>

					<div class="coin-result mt-3 text-muted small" *ngIf="!result && !isFlipping">
						{{ 'TOOLS.COIN.PLACEHOLDER' | translate }}
					</div>
				</div>

				<div class="d-flex gap-2 mt-4">
					<button class="btn btn-primary flex-grow-1" type="button" (click)="flip()" [disabled]="isFlipping">
						{{ (isFlipping ? 'TOOLS.COIN.FLIPPING' : 'TOOLS.COIN.FLIP') | translate }}
					</button>
					<button class="btn btn-outline-secondary" type="button" (click)="reset()" [disabled]="isFlipping">
						{{ 'TOOLS.COIN.RESET' | translate }}
					</button>
				</div>

				<div class="coin-stats mt-4" *ngIf="heads + tails > 0">
					<div class="d-flex justify-content-around text-center">
						<div>
							<div class="fs-4 fw-bold text-warning">{{ heads }}</div>
							<div class="small text-muted">{{ 'TOOLS.COIN.HEADS' | translate }}</div>
						</div>
						<div>
							<div class="fs-4 fw-bold">{{ heads + tails }}</div>
							<div class="small text-muted">{{ 'TOOLS.COIN.TOTAL' | translate }}</div>
						</div>
						<div>
							<div class="fs-4 fw-bold text-secondary">{{ tails }}</div>
							<div class="small text-muted">{{ 'TOOLS.COIN.TAILS' | translate }}</div>
						</div>
					</div>
				</div>
			</app-section-card>
		</div>
	</div>
</div>
