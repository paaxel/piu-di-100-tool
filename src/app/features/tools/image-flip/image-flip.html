<div class="section-block">
  <div class="row g-4">
    <div class="col-12 col-lg-4">
      <app-section-card title="Image Flip" subtitle="Ribalta in orizzontale e verticale">
        <app-file-dropzone label="Seleziona immagine" accept="image/*" (fileChange)="onFile($event)"></app-file-dropzone>

        <div class="form-check mt-3">
          <input id="flipH" class="form-check-input" type="checkbox" [(ngModel)]="flipH">
          <label class="form-check-label" for="flipH">Flip orizzontale</label>
        </div>
        <div class="form-check mt-1">
          <input id="flipV" class="form-check-input" type="checkbox" [(ngModel)]="flipV">
          <label class="form-check-label" for="flipV">Flip verticale</label>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" (click)="flip()" [disabled]="!inputPreview">Applica</button>
          <button class="btn btn-success" (click)="download()" [disabled]="!outputPreview">Download</button>
        </div>

        <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{ error }}</div>
      </app-section-card>
    </div>

    <div class="col-12 col-lg-8" *ngIf="inputPreview">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <app-section-card title="Originale">
            <img [src]="inputPreview" class="img-fluid rounded border" alt="Originale">
          </app-section-card>
        </div>
        <div class="col-12 col-md-6">
          <app-section-card title="Ribaltata">
            <img *ngIf="outputPreview" [src]="outputPreview" class="img-fluid rounded border" alt="Ribaltata">
          </app-section-card>
        </div>
      </div>
    </div>
  </div>
</div>
