<div class="section-block">
  <app-section-card title="Trova e sostituisci testo" subtitle="Sostituzione semplice o con regex">
    <div [formGroup]="form">
    <div class="mb-3">
      <label class="form-label">Testo sorgente</label>
      <textarea class="form-control" rows="6" formControlName="source"></textarea>
    </div>

    <div class="row g-2 mb-2">
      <div class="col-12 col-md-6">
        <label class="form-label">Trova</label>
        <input class="form-control" formControlName="find">
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Sostituisci con</label>
        <input class="form-control" formControlName="replace">
      </div>
    </div>

    <div class="d-flex flex-wrap gap-3 mb-3">
      <div class="form-check">
        <input id="useRegex" class="form-check-input" type="checkbox" formControlName="useRegex">
        <label class="form-check-label" for="useRegex">Regex</label>
      </div>
      <div class="form-check">
        <input id="caseSensitive" class="form-check-input" type="checkbox" formControlName="caseSensitive">
        <label class="form-check-label" for="caseSensitive">Case sensitive</label>
      </div>
      <div class="form-check">
        <input id="global" class="form-check-input" type="checkbox" formControlName="global">
        <label class="form-check-label" for="global">Globale</label>
      </div>
    </div>
    </div>

    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-primary" (click)="apply()">Applica</button>
      <button class="btn btn-outline-secondary" (click)="copy()" [disabled]="!result">Copia risultato</button>
    </div>

    <div class="mb-2 small text-muted">Sostituzioni: {{ count }}</div>
    <textarea class="form-control" rows="6" [value]="result" readonly></textarea>

    <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{ error }}</div>
  </app-section-card>
</div>
