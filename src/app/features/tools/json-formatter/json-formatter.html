<div class="section-block">
	<div class="row g-4">
		<div class="col-12">
			<app-section-card [title]="'TOOLS.JSON_FORMATTER.TITLE' | translate" [subtitle]="'TOOLS.JSON_FORMATTER.SUBTITLE' | translate">
				<form [formGroup]="form" class="row g-3">
					<div class="col-12 col-md-3">
						<label class="form-label">{{ 'TOOLS.JSON_FORMATTER.INDENT' | translate }}</label>
						<select class="form-select" formControlName="indent">
							<option [ngValue]="2">2</option>
							<option [ngValue]="4">4</option>
							<option [ngValue]="0">0 (minified)</option>
						</select>
					</div>
					<div class="col-12">
						<textarea class="form-control font-mono" rows="10" formControlName="value"></textarea>
					</div>
					<div class="col-12 d-flex gap-2 justify-content-end">
						<button class="btn btn-primary" type="button" (click)="format()">{{ 'TOOLS.JSON_FORMATTER.FORMAT' | translate }}</button>
						<button class="btn btn-outline-primary" type="button" (click)="minify()">{{ 'TOOLS.JSON_FORMATTER.MINIFY' | translate }}</button>
					</div>
					<div class="col-12" *ngIf="error">
						<div class="alert alert-danger mb-0">{{ error }}</div>
					</div>
				</form>
			</app-section-card>
		</div>
		<div class="col-12">
			<app-result-panel [label]="'TOOLS.COMMON.RESULT' | translate" [value]="result"
				[safeHtml]="result | syntaxHighlight:'json'"
				[placeholder]="'TOOLS.COMMON.OUTPUT_PLACEHOLDER' | translate" (cleared)="clearResult()"></app-result-panel>
		</div>
	</div>
</div>
