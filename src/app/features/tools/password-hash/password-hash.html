<div class="section-block">
	<app-section-card [title]="'TOOLS.HASH.TITLE' | translate" [subtitle]="'TOOLS.HASH.SUBTITLE' | translate">
		<form [formGroup]="form" class="row g-3">
			<div class="col-12">
				<label class="form-label">{{ 'TOOLS.HASH.INPUT' | translate }}</label>
				<textarea class="form-control font-mono" rows="4" formControlName="value"></textarea>
			</div>

			<div class="col-12 col-md-6">
				<label class="form-label">{{ 'TOOLS.HASH.ALGO' | translate }}</label>
				<select class="form-select" formControlName="algorithm">
					<option *ngFor="let a of algorithms" [value]="a">{{ a }}</option>
				</select>
			</div>

			<div class="col-12 col-md-6" *ngIf="isBcrypt">
				<label class="form-label">{{ 'TOOLS.HASH.BCRYPT_ROUNDS' | translate }}</label>
				<select class="form-select" formControlName="bcryptRounds">
					<option *ngFor="let r of bcryptRoundsOptions" [ngValue]="r">{{ r }}</option>
				</select>
				<small class="text-muted">{{ 'TOOLS.HASH.BCRYPT_ROUNDS_HINT' | translate }}</small>
			</div>

			<div class="col-12" *ngIf="!isBcrypt">
				<label class="form-label">{{ 'TOOLS.HASH.SALT' | translate }}</label>
				<input type="text" class="form-control font-mono" formControlName="salt" [placeholder]="'TOOLS.HASH.SALT_PLACEHOLDER' | translate" />
				<small class="text-muted">{{ 'TOOLS.HASH.SALT_HINT' | translate }}</small>
			</div>

			<div class="col-12 d-flex justify-content-end">
				<button class="btn btn-primary" type="button" (click)="compute()" [disabled]="computing">
					<span *ngIf="computing" class="spinner-border spinner-border-sm me-1" role="status"></span>
					{{ 'TOOLS.HASH.COMPUTE' | translate }}
				</button>
			</div>
		</form>

		<div class="mt-3" *ngIf="result !== null">
			<label class="form-label">{{ 'TOOLS.HASH.DIGEST' | translate }}</label>
			<div class="input-group">
				<code class="form-control font-mono" style="word-break: break-all; height: auto;">{{ result }}</code>
				<button class="btn btn-outline-secondary" type="button" (click)="copy()">Copy</button>
			</div>
			<small class="text-muted" *ngIf="isBcrypt">{{ 'TOOLS.HASH.BCRYPT_SALT_NOTE' | translate }}</small>
		</div>
	</app-section-card>
</div>
