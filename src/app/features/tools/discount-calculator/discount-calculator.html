<div class="section-block">
	<div class="row g-4">
		<div class="col-12 col-xl-8">
			<app-section-card
				[title]="'TOOLS.DISCOUNT.TITLE' | translate"
				[subtitle]="'TOOLS.DISCOUNT.SUBTITLE' | translate">
				<form [formGroup]="form" class="row g-3">

					<div class="col-12 col-md-6">
						<label class="form-label">{{ 'TOOLS.DISCOUNT.PRICE' | translate }}</label>
						<div class="input-group">
							<span class="input-group-text">€</span>
							<input
								type="number"
								min="0"
								step="0.01"
								class="form-control font-mono"
								formControlName="price"
								placeholder="0.00" />
						</div>
					</div>

					<div class="col-12 col-md-6">
						<label class="form-label">{{ 'TOOLS.DISCOUNT.DISCOUNT' | translate }}</label>
						<div class="input-group">
							<input
								type="number"
								min="0"
								max="100"
								step="any"
								class="form-control font-mono"
								formControlName="discount"
								placeholder="0" />
							<span class="input-group-text">%</span>
						</div>
					</div>

					<div class="col-12">
						<p class="text-muted small mb-0">{{ 'TOOLS.DISCOUNT.EXAMPLE' | translate }}</p>
					</div>
				</form>
			</app-section-card>
		</div>

		<div class="col-12 col-xl-4" *ngIf="result">
			<app-section-card [title]="'TOOLS.DISCOUNT.RESULT_TITLE' | translate">
				<dl class="iva-result">
					<div class="iva-result__row">
						<dt>{{ 'TOOLS.DISCOUNT.DISCOUNT_AMOUNT' | translate }}</dt>
						<dd class="font-mono">- € {{ result.importoSconto }}</dd>
					</div>
					<div class="iva-result__row iva-result__row--total">
						<dt>{{ 'TOOLS.DISCOUNT.DISCOUNTED_PRICE' | translate }}</dt>
						<dd class="font-mono">€ {{ result.prezzoScontato }}</dd>
					</div>
				</dl>
			</app-section-card>
		</div>

	</div>
</div>
