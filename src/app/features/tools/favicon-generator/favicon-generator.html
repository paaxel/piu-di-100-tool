<div class="section-block">
  <div class="row g-4">

    <!-- Controls -->
    <div class="col-12 col-xl-4">
      <app-section-card
        [title]="'TOOLS.FAVICON.TITLE' | translate"
        [subtitle]="'TOOLS.FAVICON.SUBTITLE' | translate">

        <div class="mb-3">
          <app-file-dropzone
            [label]="'TOOLS.FAVICON.SELECT_FILE' | translate"
            accept="image/*"
            (fileChange)="onFile($event)">
          </app-file-dropzone>
          <div *ngIf="error === 'FORMAT'" class="text-danger small mt-1">
            {{ 'TOOLS.FAVICON.ERROR_FORMAT' | translate }}
          </div>
          <div *ngIf="inputSize" class="text-muted small mt-1">
            {{ 'TOOLS.FAVICON.SIZES_INFO' | translate }}
          </div>
        </div>

        <div class="d-flex gap-2 mt-2" *ngIf="hasOutput">
          <button class="btn btn-success flex-grow-1" (click)="download()">
            <span class="material-symbols-outlined icon-inline me-1">download</span>
            {{ 'TOOLS.FAVICON.DOWNLOAD' | translate }}
          </button>
          <button class="btn btn-outline-secondary" (click)="reset()">
            {{ 'TOOLS.FAVICON.RESET' | translate }}
          </button>
        </div>
      </app-section-card>
    </div>

    <!-- Previews -->
    <div class="col-12 col-xl-8" *ngIf="inputPreview">
      <div class="row g-3">

        <!-- Original -->
        <div class="col-12 col-md-6">
          <app-section-card [title]="'TOOLS.FAVICON.ORIGINAL_PREVIEW' | translate">
            <img [src]="inputPreview" class="img-fluid rounded" alt="Original">
            <div class="text-muted small mt-1 text-center">{{ inputSize | fileSize }}</div>
          </app-section-card>
        </div>

        <!-- Generated sizes -->
        <div class="col-12 col-md-6" *ngIf="previews.length">
          <app-section-card [title]="'TOOLS.FAVICON.OUTPUT_PREVIEW' | translate">
            <div class="d-flex flex-wrap align-items-end gap-4 justify-content-center py-2">
              <div *ngFor="let p of previews" class="text-center">
                <img [src]="p.safeUrl"
                     [width]="p.size"
                     [height]="p.size"
                     [alt]="p.size + 'x' + p.size + ' favicon'"
                     style="image-rendering: pixelated; border: 1px solid #dee2e6; border-radius: 4px;">
                <div class="text-muted small mt-1">{{ p.size }}×{{ p.size }}</div>
              </div>
            </div>
          </app-section-card>
        </div>

      </div>
    </div>

  </div>
</div>
