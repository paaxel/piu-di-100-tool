<div class="section-block">
  <div class="row g-4">

    <!-- Inputs -->
    <div class="col-12 col-md-5 col-xl-4">
      <app-section-card title="Calcolatore BMI" subtitle="Indice di Massa Corporea">

        <div class="mb-3">
          <label class="form-label fw-semibold">Altezza (cm)</label>
          <input type="number" class="form-control" [(ngModel)]="height"
                 min="50" max="250" placeholder="es. 175">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Peso (kg)</label>
          <input type="number" class="form-control" [(ngModel)]="weight"
                 min="1" max="500" placeholder="es. 70">
        </div>

        <!-- Scale reference -->
        <div class="mt-4 small text-muted">
          <div class="d-flex justify-content-between mb-1">
            <span class="text-info">Sottopeso</span>
            <span class="text-success">Normopeso</span>
            <span class="text-warning">Sovrappeso</span>
            <span class="text-danger">Obeso</span>
          </div>
          <div class="bmi-scale position-relative rounded" style="height:10px; background: linear-gradient(to right, #0dcaf0 0%, #0dcaf0 28%, #198754 28%, #198754 50%, #ffc107 50%, #ffc107 67%, #dc3545 67%, #dc3545 100%);">
            <div *ngIf="bmi !== null"
                 class="position-absolute top-50 translate-middle rounded-circle border border-2 border-white bg-dark"
                 style="width:14px; height:14px; margin-top:-1px;"
                 [style.left]="markerPct + '%'">
            </div>
          </div>
          <div class="d-flex justify-content-between mt-1">
            <span>10</span><span>18.5</span><span>25</span><span>30</span><span>40</span>
          </div>
        </div>

      </app-section-card>
    </div>

    <!-- Result -->
    <div class="col-12 col-md-7 col-xl-8" *ngIf="bmi !== null">
      <app-section-card title="Risultato">
        <div class="text-center py-3">
          <div class="display-3 fw-bold font-mono" [class]="category?.cssClass">
            {{ bmiDisplay }}
          </div>
          <div class="mt-2">
            <span class="badge fs-6 px-3 py-2" [class]="category?.badgeClass">
              {{ category?.label }}
            </span>
          </div>
        </div>

        <hr>

        <table class="table table-sm mb-0">
          <thead>
            <tr class="text-muted small">
              <th>Categoria</th>
              <th>Valore BMI</th>
            </tr>
          </thead>
          <tbody class="small">
            <tr [class.fw-bold]="bmi !== null && bmi < 18.5">
              <td><span class="text-info">Sottopeso</span></td>
              <td>&lt; 18.5</td>
            </tr>
            <tr [class.fw-bold]="bmi !== null && bmi >= 18.5 && bmi < 25">
              <td><span class="text-success">Normopeso</span></td>
              <td>18.5 – 24.9</td>
            </tr>
            <tr [class.fw-bold]="bmi !== null && bmi >= 25 && bmi < 30">
              <td><span class="text-warning">Sovrappeso</span></td>
              <td>25 – 29.9</td>
            </tr>
            <tr [class.fw-bold]="bmi !== null && bmi >= 30">
              <td><span class="text-danger">Obeso</span></td>
              <td>&ge; 30</td>
            </tr>
          </tbody>
        </table>
      </app-section-card>
    </div>

  </div>
</div>
