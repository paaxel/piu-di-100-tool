<div class="section-block">
  <div class="row g-4">
    <div class="col-12 col-lg-4">
      <app-section-card title="Watermark Immagine" subtitle="Aggiungi un watermark testuale personalizzato">
        <app-file-dropzone label="Seleziona immagine" accept="image/*" (fileChange)="onFile($event)"></app-file-dropzone>

        <div class="mt-3">
          <label class="form-label">Testo</label>
          <input class="form-control" [(ngModel)]="text">
        </div>

        <div class="row g-2 mt-1">
          <div class="col-6">
            <label class="form-label">Colore</label>
            <input type="color" class="form-control form-control-color" [(ngModel)]="color">
          </div>
          <div class="col-6">
            <label class="form-label">Opacity (0-1)</label>
            <input type="number" class="form-control" [(ngModel)]="opacity" step="0.05" min="0" max="1">
          </div>
        </div>

        <div class="row g-2 mt-1">
          <div class="col-6">
            <label class="form-label">Font px</label>
            <input type="number" class="form-control" [(ngModel)]="fontSize" min="8" max="300">
          </div>
          <div class="col-6">
            <label class="form-label">Padding px</label>
            <input type="number" class="form-control" [(ngModel)]="padding" min="0" max="300">
          </div>
        </div>

        <div class="mt-2">
          <label class="form-label">Posizione</label>
          <select class="form-select" [(ngModel)]="position">
            <option value="top-left">Top Left</option>
            <option value="top-right">Top Right</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="bottom-right">Bottom Right</option>
            <option value="center">Center</option>
          </select>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" (click)="apply()" [disabled]="!inputPreview">Applica</button>
          <button class="btn btn-success" (click)="download()" [disabled]="!outputPreview">Download</button>
        </div>

        <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{ error }}</div>
      </app-section-card>
    </div>

    <div class="col-12 col-lg-8" *ngIf="inputPreview">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <app-section-card title="Originale">
            <img [src]="inputPreview" class="img-fluid rounded border" alt="Originale">
          </app-section-card>
        </div>
        <div class="col-12 col-md-6">
          <app-section-card title="Con Watermark">
            <img *ngIf="outputPreview" [src]="outputPreview" class="img-fluid rounded border" alt="Watermark">
          </app-section-card>
        </div>
      </div>
    </div>
  </div>
</div>
