<div class="section-block">
  <div class="row g-4">
    <div class="col-12 col-lg-5">
      <app-section-card title="Generatore Barcode" subtitle="Crea barcode 1D: CODE128, EAN13, EAN8, UPC, ITF14, MSI e Pharmacode, compatibili con stampanti e scanner">
        <div [formGroup]="form">
        <div class="mb-2">
          <label class="form-label">Valore</label>
          <input
            class="form-control"
            formControlName="value"
            placeholder="123456789012"
            [attr.maxlength]="maxValueLength"
            (input)="onValueInput()">
          <small class="text-muted">{{ formatHint }} (max: {{ maxValueLength }})</small>
        </div>

        <div class="mb-2">
          <label class="form-label">Formato</label>
          <select class="form-select" formControlName="format" (change)="onFormatChange()">
            <option *ngFor="let f of formats" [value]="f">{{ f }}</option>
          </select>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">Width</label>
            <input type="number" class="form-control" formControlName="width" min="1" max="5">
          </div>
          <div class="col-6">
            <label class="form-label">Height</label>
            <input type="number" class="form-control" formControlName="height" min="40" max="180">
          </div>
        </div>

        <div class="form-check mb-3">
          <input id="showText" class="form-check-input" type="checkbox" formControlName="displayValue">
          <label for="showText" class="form-check-label">Mostra testo sotto il barcode</label>
        </div>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" (click)="generate()">Genera</button>
          <button class="btn btn-success" (click)="download()">Download PNG</button>
        </div>
      </app-section-card>
      <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{ error }}</div>
    </div>

    <div class="col-12 col-lg-7">
      <app-section-card title="Anteprima">
        <div class="bg-white border rounded p-3 text-center">
          <canvas #barcodeCanvas></canvas>
        </div>
      </app-section-card>
    </div>
  </div>
</div>
