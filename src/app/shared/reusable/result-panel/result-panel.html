<section class="card border-0 shadow-sm result-panel">
	<div class="card-body p-4">
		<div class="d-flex justify-content-between align-items-center mb-2">
			<span class="text-uppercase text-muted small fw-semibold">{{ label }}</span>
			<div class="d-flex gap-2">
				<button class="btn btn-sm btn-outline-secondary" type="button" (click)="copyValue()">Copy</button>
				<button class="btn btn-sm btn-outline-danger" type="button" (click)="clear()">Clear</button>
			</div>
		</div>

		<ng-container *ngIf="safeHtml || value; else emptyResult">
			<div class="result-box" *ngIf="safeHtml" [innerHTML]="safeHtml"></div>
			<div class="result-box" *ngIf="!safeHtml">{{ value }}</div>
		</ng-container>
		<ng-template #emptyResult>
			<div class="result-box text-muted">{{ placeholder }}</div>
		</ng-template>
	</div>
</section>
